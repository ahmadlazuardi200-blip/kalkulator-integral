<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Integral Substitusi</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="kalkulator">
        <h1>Kalkulator Integral Substitusi KELOMPOK 2</h1>

        <p>Masukkan soal integral yang ingin dihitung.</p>

        <input
            type="text"
            id="soal"
            placeholder="Contoh: ∫ (2x + 3)^5 dx"
        >

        <br>

        <button type="button" id="tombolHitung">Hitung Langkah</button>

        <h2>Langkah Penyelesaian</h2>

        <div id="hasil">Hasil perhitungan akan muncul di sini.</div>
    </main>
    <script src="script.js"></script>
</body>
</html>
